name: Daily official source check

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore prior source fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .source-monitor/state.json
          key: source-monitor-${{ github.run_id }}
          restore-keys: source-monitor-
      - name: Check official sources
        id: monitor
        continue-on-error: true
        run: npm run check:sources
      - name: Save current source fingerprints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .source-monitor/state.json
          key: source-monitor-${{ github.run_id }}
      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-${{ github.run_id }}
          path: .source-monitor/report.json
          retention-days: 30
      - name: Open or update review issue
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.source-monitor/report.json', 'utf8'));
            const lines = [
              '## Official price, quota, or promotion source changed',
              '',
              `Checked: ${report.checked} · At: ${report.checkedAt}`,
              '',
              ...report.changes.map(x => `- **${x.id}** — ${x.type}\n  - ${x.url}\n  - before: \`${x.before}\`\n  - after: \`${x.after}\``),
              ...report.failures.map(x => `- **${x.id}** — unreachable (${x.status || x.error})\n  - ${x.url}`),
              '',
              '> Automation only flags possible changes. Verify the official page manually before editing facts or verifiedAt.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ];
            const title = 'Review official pricing, quota, or promotion source changes';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'source-change' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'source-change', color: 'DFFF00', description: 'Official pricing, quota, or promotion source needs review' });
            }
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'source-change' });
            const existing = data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: lines.join('\n') });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body: lines.join('\n'), labels: ['source-change'] });
            }
