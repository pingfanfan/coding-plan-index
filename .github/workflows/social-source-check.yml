name: Social announcement discovery

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore social cursor
        uses: actions/cache/restore@v4
        with:
          path: .social-monitor/state.json
          key: social-monitor-${{ github.run_id }}
          restore-keys: social-monitor-
      - name: Check trusted social sources through the official X API
        id: monitor
        continue-on-error: true
        run: npm run check:social
      - name: Save social cursor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .social-monitor/state.json
          key: social-monitor-${{ github.run_id }}
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-discovery-${{ github.run_id }}
          path: .social-monitor/report.json
          retention-days: 30
      - name: Open or update review issue
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.social-monitor/report.json', 'utf8'));
            const lines = [
              '## Trusted social source posted a possible plan or usage update',
              '',
              `Checked: ${report.checked} · At: ${report.checkedAt}`,
              '',
              ...report.findings.map(x => `- **${x.displayName} (${x.handle})** · ${x.authority} · ${x.createdAt}\n  - ${x.snippet}\n  - ${x.url}`),
              ...report.failures.map(x => `- **${x.id}** — X API error ${x.status}\n  - ${x.detail}`),
              '',
              '> Social posts are discovery signals. Confirm scope in the account UI, official docs, or a second first-party source before changing plan facts.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ];
            const title = 'Review new vendor social announcements';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'social-signal' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'social-signal', color: '315EFB', description: 'Trusted vendor social post needs verification' });
            }
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'social-signal' });
            const existing = data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: lines.join('\n') });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body: lines.join('\n'), labels: ['social-signal'] });
            }
