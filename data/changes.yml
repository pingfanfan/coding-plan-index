    summary: OpenAI 官方帮助中心新增一次性用量重置说明：符合资格的用户可能获得 Codex 或 ChatGPT Work 的一次性 Reset；自动 Reset 直接刷新对应窗口，不会保存为可稍后使用的额度，部分活动另含 banked reset。
