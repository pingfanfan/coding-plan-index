    kind: quota
    previous: 站内原记录把 Claude Code 临时 +50% 周用量活动标注为 2026-08-31 结束；本次官方公告将过渡日期更新为 2026-09-14。
    current: 原帖发布时间为 2026-08-30 00:47（北京时间）；9 月 14 日起按标准额度永久提高 25%，当前临时 +50% 在此前继续有效。按官方后续说明，相比当前临时 +50% 水平，切换后实际约减少 17%；5 小时窗口没有在本公告中改变。
    effectiveAt: 2026-09-14
    effectiveLabel: 2026-09-14 起 · 标准周额度永久提高 25%
