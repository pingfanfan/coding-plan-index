    title: Tibo 宣布 Codex 20M 用户里程碑赠送 Banked Reset
    summary: OpenAI Codex 负责人 Tibo 在 X 宣布 Codex 达到 2,000 万活跃用户，并发放可储存的 Banked Reset；后续帖子说明付费 Codex 与 ChatGPT Work 用户会陆续收到，最终以账户内 Usage 页面为准。
